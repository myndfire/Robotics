[project]
name = "camera-agent"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "agent-harness",
    "embedded-system-services",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
# Local checkout while the multimodal prompt change is unreleased. Switch back
# to the git source once it lands upstream:
#   agent-harness = { git = "https://github.com/myndfire/pydanticai-fluent.git", subdirectory = "agent_harness" }
agent-harness = { path = "../../pydanticai-fluent/agent_harness", editable = true }
embedded-system-services = { path = "../python-libs" }
