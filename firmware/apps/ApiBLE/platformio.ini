; PlatformIO Project Configuration File
; ApiBLE — Unified BLE app: Camera + GPIO + Config for ESP32-S3-CAM
;
; Target: nulllaborg ESP32-S3-CAM (OV2640/OV3660, 8MB Flash, 8MB PSRAM)
; USB-C native CDC serial. No NeoPixel. No OLED.
;
; Build:   uv run pio run --target upload
; Monitor: uv run pio run --target upload --target monitor

[env:esp32-s3-cam]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 921600

lib_extra_dirs = ../../device_drivers
lib_deps = adafruit/Adafruit NeoPixel@^1.12.4

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi

board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = default_8MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
